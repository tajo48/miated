name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Stamp service worker version (last commit)
        run: sed -i "s/@@VERSION@@/${{ github.sha }}/" sw.js

      - name: Assemble site
        run: |
          mkdir -p _site
          cp index.html manifest.json sw.js favicon.svg favicon-32.png \
             apple-touch-icon.png icon-192.png icon-512.png \
             icon-192-maskable.png icon-512-maskable.png _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
