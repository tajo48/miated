<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Miated</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#232634">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Miated">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
  :root {
    --bebas: "Bebas Neue", Impact, Haettenschweiler, "Arial Narrow", sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  html {
    height: 100%; /* makes body's min-height resolve → route box can dock */
    overscroll-behavior: none;
    scrollbar-width: none; /* Firefox */
    -ms-overflow-style: none; /* old Edge/IE */
  }
  html::-webkit-scrollbar { display: none; /* Chrome/Safari/WebKit */ }

  body {
    background: #232634;
    min-height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    padding: 14px 14px calc(24px + env(safe-area-inset-bottom, 0px));
    font-family: Verdana, "DejaVu Sans", Geneva, sans-serif;
    color: #c6d0f5;
    overscroll-behavior: none;
    scrollbar-width: none;
    -ms-overflow-style: none;
  }
  body::-webkit-scrollbar { display: none; }

  /* The dot field is the site background: fixed, full-viewport, behind the
     UI, never catching pointers. */
  #viz {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    pointer-events: none;
  }

  .wrap {
    position: relative;
    z-index: 1;
    flex: 1 0 auto; /* lets the route box dock at the bottom of the viewport */
    width: min(92vw, 480px);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
  }

  /* ---------- top bar ---------- */
  .topbar { width: 100%; display: flex; align-items: center; }
  .brandRow { display: flex; align-items: center; gap: 8px; }
  .brandRow img { width: 30px; height: 30px; border-radius: 7px; display: block; }
  .brandRow h1 {
    font-family: var(--bebas);
    font-size: 26px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: #8caaee;
    font-weight: normal;
  }

  /* ---------- the readouts ---------- */
  .stats { display: flex; flex-wrap: wrap; align-items: stretch; gap: 14px; width: 100%; }
  .stat {
    flex: 1 1 150px;
    min-width: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    background: rgba(48, 52, 70, 0.82); /* surface, slightly clear so the dots peek through */
    -webkit-backdrop-filter: blur(6px);
    backdrop-filter: blur(6px);
    border: 2px solid #51576d;
    border-radius: 6px;
    padding: 26px 16px 20px;
    user-select: none;
  }
  .stat .label {
    font-size: 12px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #a5adce;
  }
  .stat .value {
    font-family: var(--bebas);
    font-size: clamp(36px, 17vw, 72px);
    line-height: 1;
    color: #8caaee;
    font-variant-numeric: tabular-nums;
    min-height: 72px;
    display: flex;
    align-items: center;
    max-width: 100%;
    white-space: nowrap;
  }
  .stat .unit { font-size: 13px; color: #a5adce; }

  button.allow {
    font-family: var(--bebas);
    font-size: 18px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    background: #8caaee;
    color: #292c3c;
    border: 2px solid #51576d;
    border-radius: 6px;
    padding: 10px 22px 7px;
    cursor: pointer;
    touch-action: manipulation;
    user-select: none;
    -webkit-user-select: none;
    transition: transform 0.08s ease;
  }
  button.allow:active { transform: scale(0.96); }
  button.allow:focus-visible { outline: 2px solid #8caaee; outline-offset: 2px; }
  button.allow[hidden] { display: none; }

  .btnRow { display: flex; justify-content: center; flex-wrap: wrap; gap: 10px; width: 100%; }

  /* ---------- route box (compass + backtrack) ---------- */
  #routeCard {
    position: relative; /* anchors the checkpoint menu */
    width: min(64vw, 280px);
    margin-top: auto; /* dock at the bottom */
    margin-left: auto;
    margin-right: auto;
    padding: 0;
    background: transparent;
    border: none; /* the canvas carries the single border */
  }
  #routeCard[hidden] { display: none; }
  #route {
    width: 100%;
    aspect-ratio: 1 / 1;
    display: block;
    border-radius: 10px;
    background: #292c3c; /* mantle: darker than the card, delineates the dial */
    touch-action: none; /* pinch on the dial zooms the route, not the page */
  }
  #routeCard[hidden] { display: none; }

  /* checkpoint sheet: full-width bottom sheet — no flimsy floating menu */
  #cpBackdrop {
    position: fixed;
    inset: 0;
    background: rgba(23, 26, 35, 0.6);
    z-index: 40;
  }
  #cpBackdrop[hidden] { display: none; }
  #cpMenu {
    position: fixed;
    left: 50%;
    bottom: 0;
    transform: translateX(-50%);
    width: min(92vw, 360px);
    background: #292c3c;
    border: 1px solid #51576d;
    border-bottom: none;
    border-radius: 18px 18px 0 0;
    padding: 14px 14px calc(14px + env(safe-area-inset-bottom, 0px));
    display: flex;
    flex-direction: column;
    gap: 10px;
    z-index: 41;
    animation: cpSheetUp 0.18s ease-out;
  }
  #cpMenu[hidden] { display: none; }
  @keyframes cpSheetUp {
    from { transform: translateX(-50%) translateY(100%); }
    to { transform: translateX(-50%) translateY(0); }
  }
  #cpMenu .cpTitle {
    font-family: var(--bebas);
    font-size: 15px;
    letter-spacing: 2px;
    color: #a5adce;
    text-align: center;
    padding-bottom: 2px;
  }
  #cpMenu button {
    font-family: var(--bebas);
    font-size: 22px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    border-radius: 10px;
    padding: 14px 16px 10px;
    cursor: pointer;
    touch-action: manipulation;
    user-select: none;
    -webkit-user-select: none;
    background: #414559;
    border: 1px solid #51576d;
    color: #e5c890;
  }
  #cpMenu button:active { transform: scale(0.97); }
  #cpRemoveBtn { color: #e78284; }
  #cpRemoveBtn:disabled { opacity: 0.35; }
  #cpCancelBtn { color: #a5adce; background: #232630; }
</style>
</head>
<body>

<canvas id="viz"></canvas>

<div class="wrap">
  <div class="topbar">
    <div class="brandRow"><img src="favicon.svg" alt=""><h1>Miated</h1></div>
  </div>

  <div class="btnRow">
    <button id="allowMicBtn" class="allow">Allow mic</button>
    <button id="allowGpsBtn" class="allow">Allow location</button>
  </div>

  <div class="stats">
    <div class="stat"><span class="label">Speed</span><span class="value" id="speed">–</span><span class="unit">km/h</span></div>
    <div class="stat"><span class="label">Accel</span><span class="value" id="accel">–</span><span class="unit">m/s²</span></div>
  </div>

  <div class="card" id="routeCard" hidden>
    <canvas id="route"></canvas>
  </div>
</div>

<script>
"use strict";

/* ---------- elements ---------- */

const canvas = document.getElementById("viz");
const ctx = canvas.getContext("2d");
const speedEl = document.getElementById("speed");
const accelEl = document.getElementById("accel");
const allowMicBtn = document.getElementById("allowMicBtn");
const allowGpsBtn = document.getElementById("allowGpsBtn");
const routeCard = document.getElementById("routeCard");
const routeCanvas = document.getElementById("route");
const rctx = routeCanvas.getContext("2d");

/* ---------- microphone (auto-start) ---------- */

/* No player, no buttons: on load the page asks for the microphone and GPS.
   The mic hears whatever is playing out loud — any app. Music on headphones
   is invisible to a mic; that is the one trade-off of the buttonless flow. */

let actx = null;
let analyser = null;
let freq = null;
let listening = false;
let micTries = 0;    // bounded retries: a user gesture is what makes Chrome prompt

function ensureGraph() {
  if (actx) {
    if (actx.state === "suspended") actx.resume().catch(() => {});
    return;
  }
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  actx = new AC();
  analyser = actx.createAnalyser();
  analyser.fftSize = 512;
  analyser.smoothingTimeConstant = 0.7;
  freq = new Uint8Array(analyser.frequencyBinCount);
}

/* Autoplay + permissions: Chrome won't always prompt without user activation,
   so every tap re-attempts (bounded) until both streams are in. */
function wakeAudio() {
  if (actx && actx.state === "suspended") actx.resume().catch(() => {});
}
let gestureTries = 0;
function onGesture() {
  wakeAudio();
  if (gestureTries < 60) {
    gestureTries++;
    startMic();
    startGps();
  }
}
["pointerdown", "keydown"].forEach((ev) =>
  document.addEventListener(ev, onGesture)
);
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") {
    onGesture();
    requestWakeLock();
  }
});

function startMic() {
  if (listening || micPerm === "denied" || micTries >= 30) return;
  micTries++;
  if (!window.isSecureContext || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    return; // no mic path (insecure origin / unsupported) — dots just idle
  }
  navigator.mediaDevices.getUserMedia({
    audio: {
      echoCancellation: false,  // phone-call processing would duck the beats
      noiseSuppression: false,  // keep the drums
      autoGainControl: false,   // keep loudness honest for the visualizer
    },
  }).then((media) => {
    ensureGraph();
    const srcNode = actx.createMediaStreamSource(media);
    srcNode.connect(analyser);
    listening = true;
    micAllowed = true;
    wakeAudio();
    updateAllowButton();
    media.getAudioTracks()[0].addEventListener("ended", () => {
      listening = false;
    });
  }).catch(() => {}); // denied or unavailable: the field simply stays idle
}

/* ---------- analysis: level, beats, tempo ---------- */

let level = 0;        // smoothed overall loudness 0..1
let beatPulse = 0;    // 1 on a detected beat, decays
let tempo = 1;        // smoothed speed multiplier derived from BPM

const bassHistory = [];
const beatIntervals = [];
let lastBeat = 0;
const waves = []; // { r, e } — light waves expanding through the dot grid

function analyse(ts) {
  if (!analyser || !listening) return 0;
  analyser.getByteFrequencyData(freq);

  let sum = 0;
  const top = Math.min(freq.length, 180);
  for (let i = 2; i < top; i++) sum += freq[i];
  const loud = Math.min(1, (sum / (top - 2) / 255) * 1.6);

  let bsum = 0;
  for (let i = 1; i <= 10; i++) bsum += freq[i];
  const bassNow = bsum / 10 / 255;

  // beat: bass spike above the recent average, rate-limited
  bassHistory.push(bassNow);
  if (bassHistory.length > 45) bassHistory.shift();
  let hsum = 0;
  for (const v of bassHistory) hsum += v;
  const havg = hsum / bassHistory.length;
  if (bassNow > 0.3 && bassNow > havg * 1.4 && ts - lastBeat > 220) {
    if (lastBeat) {
      beatIntervals.push(ts - lastBeat);
      if (beatIntervals.length > 10) beatIntervals.shift();
      const sorted = [...beatIntervals].sort((a, b) => a - b);
      const median = sorted[sorted.length >> 1];
      const bpm = 60000 / median;
      tempo += (Math.min(2.2, Math.max(0.4, bpm / 110)) - tempo) * 0.15;
    }
    lastBeat = ts;
    beatPulse = 1;
    waves.push({ r: 0, e: Math.min(1, bassNow * 1.5) });
    if (waves.length > 5) waves.shift();
  }

  return loud;
}

/* ---------- the dot field ---------- */

/* A full-page grid of dots — the site's background. Each dot belongs to a
   frequency band given by its HEXAGONAL distance from the screen center
   (1 = on the edge of a big pointy-top hexagon): bass lights the middle
   hexagons, highs the outer ones, and every detected beat sends a hexagonal
   wave of light expanding outward. With no music the field rests in a faint
   breathing pattern. */

const dots = []; // { x, y, hex, hue } in CSS px, rebuilt on resize
let gridSpacing = 0;
let hueDrift = 0;   // slow rotation of the field's palette
let hueDrift2 = 0;  // second, slower drift layered on top

function rebuildGrid() {
  dots.length = 0;
  const w = window.innerWidth;
  const h = window.innerHeight;
  const unit = Math.min(w, h);
  // Dense, but half the previous count: 9–17 px cells (count ∝ 1/spacing²),
  // relaxed only when the viewport is so large that the dot count would tank
  // the frame rate.
  let spacing = Math.max(9, Math.min(17, unit / 45));
  const maxDots = 8000;
  if ((w / spacing) * (h / spacing) > maxDots) {
    spacing = Math.sqrt((w * h) / maxDots);
  }
  gridSpacing = spacing;

  const cx = w / 2;
  const cy = h / 2;
  const rHex = Math.hypot(w, h) / 2; // hexagon "radius": center → vertex

  for (let y = spacing / 2; y < h; y += spacing) {
    for (let x = spacing / 2; x < w; x += spacing) {
      const dx = x - cx;
      const dy = y - cy;
      const r = Math.hypot(dx, dy);
      // Distance to the hexagon edge along this direction (1 = on the edge,
      // 0 = center, >1 outside): support function of a regular hexagon.
      const ang = Math.atan2(dy, dx) - Math.PI / 2; // pointy-top
      const rel = ((ang % (Math.PI / 3)) + Math.PI / 3) % (Math.PI / 3);
      const hex = (r * Math.cos(rel - Math.PI / 6)) / (rHex * Math.cos(Math.PI / 6));
      dots.push({ x, y, hex, hue: (30 + hex * 280) % 360 });
    }
  }
}

function draw(ts, dt) {
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const w = window.innerWidth;
  const h = window.innerHeight;
  if (canvas.width !== Math.round(w * dpr) || canvas.height !== Math.round(h * dpr)) {
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    rebuildGrid();
  }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);

  const t = ts / 1000;
  hueDrift += dt * 4;
  hueDrift2 += dt * 2;

  // advance the beat waves
  const waveSpeed = (0.28 + tempo * 0.22) * dt;
  for (let i = waves.length - 1; i >= 0; i--) {
    waves[i].r += waveSpeed;
    waves[i].e -= dt * 0.9;
    if (waves[i].e <= 0 || waves[i].r > 1.3) waves.splice(i, 1);
  }

  // Dots start small and grow with the music up to exactly touching their
  // neighbors — never past it, so they never blend into each other.
  const baseR = gridSpacing * 0.22;
  const maxR = gridSpacing * 0.5;

  /* Thousands of dots per frame: batch them into a handful of Path2D
     buckets (quantized hue × alpha) and issue one fill per bucket — per-dot
     fill calls would melt the frame rate at this density. */
  const buckets = new Map();

  for (const d of dots) {
    // frequency band by hexagonal distance from center: bass middle, highs outside
    let v = 0;
    if (analyser && listening) {
      const bin = 2 + Math.floor(Math.pow(d.hex, 1.35) * 160);
      v = freq[Math.min(bin, freq.length - 1)] / 255;
    }

    // beat waves passing through this dot
    let waveBoost = 0;
    for (const wave of waves) {
      const dd = (d.hex - wave.r) * 9;
      waveBoost += Math.exp(-dd * dd) * wave.e;
    }

    // idle: faint breathing ripple so the pattern is alive but quiet
    const idle = 0.04 + 0.03 * Math.sin(t * 0.9 - d.hex * 6);

    let a = idle + v * 0.75 + waveBoost * 0.45;
    if (a <= 0.02) continue;
    if (a > 0.92) a = 0.92;
    const aQ = Math.round(a * 12) / 12;
    const hue = (((d.hue + hueDrift + hueDrift2 * 0.5) % 360) + 360) % 360;
    const hueQ = (Math.round(hue / 15) * 15) % 360;
    const drive = Math.min(1, v * 1.4 + waveBoost * 0.9);
    const r = baseR + (maxR - baseR) * drive;

    const key = (hueQ / 15) * 13 + Math.round(aQ * 12);
    let bucket = buckets.get(key);
    if (!bucket) {
      bucket = [new Path2D(), hueQ, aQ];
      buckets.set(key, bucket);
    }
    bucket[0].moveTo(d.x + r, d.y);
    bucket[0].arc(d.x, d.y, r, 0, Math.PI * 2);
  }

  for (const [path, hueQ, aQ] of buckets.values()) {
    ctx.fillStyle = `hsla(${hueQ}, ${45 + aQ * 30}%, ${36 + aQ * 26}%, ${aQ})`;
    ctx.fill(path);
  }
}

let lastTs = 0;

function frame(ts) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, lastTs ? (ts - lastTs) / 1000 : 0.016);
  lastTs = ts;

  const target = analyse(ts);
  // fast attack, slow release
  level += (target - level) * Math.min(1, dt * (target > level ? 16 : 5));
  beatPulse = Math.max(0, beatPulse - dt * 3);
  updateHeading(dt);

  draw(ts, dt);
  if (routeShown && !routeCard.hidden) drawRouteBox(dt);
}
requestAnimationFrame(frame);

/* ---------- gps speed & acceleration (auto-start) ---------- */

/* watchPosition feeds fixes; speed comes straight from the device when it
   has one, otherwise it's derived from the distance between fixes. The
   acceleration is the smoothed derivative of that speed. */

let prev = null;       // { lat, lon, t, speed } of the previous fix
const MAX_SPEED = 260 / 3.6; // m/s — GPS fixes faster than this are glitches
const MAX_ACCEL = 20;        // m/s² — ~2 g; beyond this it's a fix-to-fix spike
let speedSm = null;    // EMA of speed (m/s)
let accelSm = null;    // EMA of acceleration (m/s²)
let maxSpeed = 0;      // session peaks, for the share image
let maxAccel = 0;
let cur = null;        // latest fix { lat, lon }

let watchId = null;
let gpsTries = 0;
let gpsLocked = false;

/* Android's quiet permission UI silently auto-denies load-time requests.
   Knowing the state keeps retries sane: "denied" can only be fixed in site
   settings, "prompt" is worth re-asking on every tap. */
let micPerm = null; // "granted" | "denied" | "prompt"
let gpsPerm = null;

function queryPerms() {
  if (!navigator.permissions || !navigator.permissions.query) return;
  navigator.permissions.query({ name: "microphone" }).then((s) => {
    micPerm = s.state;
    s.onchange = () => {
      micPerm = s.state;
      if (micPerm === "granted") {
        micAllowed = true;
        updateAllowButton();
      }
    };
    if (micPerm === "granted") {
      micAllowed = true;
      updateAllowButton();
    }
  }).catch(() => {});
  navigator.permissions.query({ name: "geolocation" }).then((s) => {
    gpsPerm = s.state;
    s.onchange = () => {
      gpsPerm = s.state;
      if (gpsPerm === "granted") {
        gpsAllowed = true;
        updateAllowButton();
      }
    };
    if (gpsPerm === "granted") {
      gpsAllowed = true;
      updateAllowButton();
    }
  }).catch(() => {});
}

function haversine(lat1, lon1, lat2, lon2) {
  const rad = Math.PI / 180;
  const dLat = (lat2 - lat1) * rad;
  const dLon = (lon2 - lon1) * rad;
  const s = Math.sin(dLat / 2) ** 2 +
    Math.cos(lat1 * rad) * Math.cos(lat2 * rad) * Math.sin(dLon / 2) ** 2;
  return 2 * 6371000 * Math.asin(Math.sqrt(s));
}

function startGps() {
  if (gpsLocked || gpsPerm === "denied" || gpsTries >= 20) return;
  gpsTries++;
  if (!window.isSecureContext || !("geolocation" in navigator)) {
    return; // no GPS path — readouts just stay at –
  }
  if (watchId !== null) navigator.geolocation.clearWatch(watchId);
  watchId = navigator.geolocation.watchPosition(onFix, () => {}, {
    enableHighAccuracy: true,
    maximumAge: 0,
    timeout: 20000,
  });
}

// Shrink the big readout font until it fits inside its card.
function fitValue(el) {
  el.style.fontSize = "";
  let size = parseFloat(getComputedStyle(el).fontSize);
  const avail = el.parentElement.clientWidth - 32; // card width minus side padding
  while (el.scrollWidth > avail && size > 18) {
    size -= 2;
    el.style.fontSize = size + "px";
  }
}

function onFix(p) {
  gpsLocked = true;
  gpsAllowed = true;
  updateAllowButton();
  const c = p.coords;
  const t = p.timestamp;

  // Reject fixes that imply physically impossible motion — these are GPS
  // glitches (multipath, lock re-acquisition) that spike speed/accel and
  // teleport the route. MAX_SPEED ≈ 260 km/h, MAX_ACCEL ≈ 2 g.
  if (prev) {
    const dt = (t - prev.t) / 1000;
    if (dt > 0 && dt < 10) {
      const jump = haversine(prev.lat, prev.lon, c.latitude, c.longitude) / dt;
      if (jump > MAX_SPEED) return; // drop the whole fix, keep prev intact
    }
    if (prev.speed != null && c.speed != null && dt > 0 && dt < 2 &&
        Math.abs(c.speed - prev.speed) > MAX_ACCEL * dt) {
      // speed spike from the chipset without a matching position jump —
      // fall back to position-derived speed instead of trusting it
      c.speed = null;
    }
  }

  // reveal the route box on the first fix
  if (!routeShown) {
    routeShown = true;
    routeCard.hidden = false;
  }

  // record the traveled route (decimate if it grows huge)
  const last = route[route.length - 1];
  if (!last || haversine(last.lat, last.lon, c.latitude, c.longitude) > 2) {
    route.push({ lat: c.latitude, lon: c.longitude, t: Date.now() });
    if (route.length > 1500) route = route.filter((_, i) => i % 2 === 0);
    pruneRoute();
    saveRouteSoon();
  }

  // GPS course-over-ground: truth while moving, and the reference the
  // compass offset is calibrated against. Phones report garbage course at
  // low speeds, so only trust it when the fix itself is actually moving.
  if (c.heading != null && !isNaN(c.heading) && (c.speed == null || c.speed > 1)) {
    lastCourse = c.heading;
  }

  cur = { lat: c.latitude, lon: c.longitude };

  let speed = c.speed != null && c.speed >= 0 && c.speed <= MAX_SPEED ? c.speed : null; // m/s
  if (speed === null && prev && t > prev.t) {
    const d = haversine(prev.lat, prev.lon, c.latitude, c.longitude);
    const dt = (t - prev.t) / 1000;
    if (dt > 0 && d / dt <= MAX_SPEED) speed = d / dt;
  }

  if (speed !== null) {
    speedSm = speedSm === null ? speed : speedSm + (speed - speedSm) * 0.35;
    speedEl.textContent = (speedSm * 3.6).toFixed(1);
    fitValue(speedEl);
    maxSpeed = Math.max(maxSpeed, speedSm);
  }

  if (speed !== null && prev && prev.speed !== null && t > prev.t) {
    const a = (speed - prev.speed) / ((t - prev.t) / 1000);
    if (Math.abs(a) <= MAX_ACCEL) { // ignore spike frames entirely
      accelSm = accelSm === null ? a : accelSm + (a - accelSm) * 0.25;
      accelEl.textContent = accelSm.toFixed(2);
      fitValue(accelEl);
      maxAccel = Math.max(maxAccel, Math.abs(accelSm));
    }
  }

  prev = { lat: c.latitude, lon: c.longitude, t, speed };
}

/* ---------- route box: compass + backtrack ---------- */

/* Heading-up radar: the traveled route is drawn as dots around your position
   and the whole scene — rose AND route — rotates so your heading sits at the
   top. Zoom fits the route automatically — pinching overrides it for ~10
   seconds, then it eases back to automatic. Tracking never stops. */

let route = [];
let routeShown = false;
let userZoom = 1;      // manual zoom factor while zooming
let zoomFactor = 1;    // smoothed zoom actually applied
let lastManualZoom = -1e9;
let viewScale = null; // smoothed px-per-meter

/* Persistence: every dot carries its creation time (t) and the whole route
   survives reloads in localStorage, expiring 24 h after it was recorded. */
const ROUTE_KEY = "miatedRoute";
const ROUTE_TTL = 24 * 60 * 60 * 1000;
let routeSaveTimer = null;

function loadRoute() {
  try {
    const arr = JSON.parse(localStorage.getItem(ROUTE_KEY) || "null");
    if (!Array.isArray(arr)) return;
    const cutoff = Date.now() - ROUTE_TTL;
    route = arr.filter((p) => p && typeof p.lat === "number" &&
      typeof p.lon === "number" && typeof p.t === "number" && p.t > cutoff);
  } catch {} // private mode / quota / corrupt data — start fresh
}

function pruneRoute() {
  // cheap: only re-filter once something has actually expired
  if (route.length && route[0].t <= Date.now() - ROUTE_TTL) {
    route = route.filter((p) => p.t > Date.now() - ROUTE_TTL);
  }
}

function saveRoute() {
  try {
    localStorage.setItem(ROUTE_KEY, JSON.stringify(route));
  } catch {} // private mode / quota — persistence is best-effort
}

// debounced: at most one write every few seconds while GPS feeds fixes
function saveRouteSoon() {
  if (routeSaveTimer) return;
  routeSaveTimer = setTimeout(() => {
    routeSaveTimer = null;
    saveRoute();
  }, 4000);
}
window.addEventListener("pagehide", saveRoute);
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "hidden") saveRoute();
});
loadRoute();

/* Heading-up projection: rotate a dot's east/north offset (meters from the
   current position) by the heading, so a point that is ahead of me is always
   up on screen. Shared by the live canvas and the share image. */
function routeProjector(curPos, hdgDeg) {
  const rad = Math.PI / 180;
  const cosH = Math.cos(hdgDeg * rad), sinH = Math.sin(hdgDeg * rad);
  const mLat = 111320;
  const mLon = 111320 * Math.cos(curPos.lat * rad);
  return (p) => {
    const e = (p.lon - curPos.lon) * mLon;
    const n = (curPos.lat - p.lat) * mLat;
    return [e * cosH - n * sinH, e * sinH + n * cosH]; // [screen x, −screen y] in meters
  };
}

// fit rule: bounding box of all live dots in rotated screen space, floored
// so a stationary user isn't pushed way out
function routeFitExtent(proj, dots) {
  let e = 5;
  for (const p of dots) {
    const [x, y] = proj(p);
    e = Math.max(e, Math.abs(x), Math.abs(y));
  }
  return e;
}

/* The route layer itself — shared by the live canvas and the share image:
   a translucent polyline through the dots (oldest → newest, extended to the
   current position) drawn under the dots, all heading-up. */
function drawRouteLayer(g, cx, cy, s, hdgDeg, curPos, dots, dotR, markerR) {
  const proj = routeProjector(curPos, hdgDeg);
  const pts = dots
    .map((p) => {
      const [x, y] = proj(p);
      return [cx + x * s, cy - y * s, p.t, !!p.cp];
    })
    .sort((a, b) => a[2] - b[2]); // chronological by creation time, not index
  const n = pts.length;

  // connecting line: per-segment alpha ramping oldest → newest, ending at me
  g.lineJoin = "round";
  g.lineCap = "round";
  g.lineWidth = dotR * 1.2;
  for (let i = 0; i < n; i++) {
    const a = pts[i];
    const b = i + 1 < n ? pts[i + 1] : [cx, cy];
    g.beginPath();
    g.moveTo(a[0], a[1]);
    g.lineTo(b[0], b[1]);
    g.strokeStyle = `rgba(140, 170, 238, ${0.15 + (n > 1 ? i / (n - 1) : 1) * 0.45})`;
    g.stroke();
  }

  // dots, older ones fading toward the start; checkpoints get a ring so
  // manually dropped points stand out from GPS-recorded ones
  for (let i = 0; i < n; i++) {
    const [x, y, , cp] = pts[i];
    const age = n > 1 ? i / (n - 1) : 1;
    g.beginPath();
    g.arc(x, y, cp ? dotR * 1.6 : dotR, 0, Math.PI * 2);
    g.fillStyle = cp ? "rgba(234, 154, 151, 0.95)" : `rgba(140, 170, 238, ${0.3 + age * 0.7})`;
    g.fill();
    if (cp) {
      g.beginPath();
      g.arc(x, y, dotR * 0.6, 0, Math.PI * 2);
      g.fillStyle = "rgba(46, 52, 64, 0.9)";
      g.fill();
    }
  }

  // current position: green dot with a soft glow
  g.beginPath();
  g.arc(cx, cy, markerR, 0, Math.PI * 2);
  g.fillStyle = "#a6d189";
  g.shadowColor = "#a6d189";
  g.shadowBlur = 10;
  g.fill();
  g.shadowBlur = 0;
}
/* ---------- range rings ---------- */

/* Apple-Watch-compass-style range rings: concentric circles at REAL meter
   distances around the position. Spacing snaps to a 1-2-5 ladder so the
   labels stay round, rings are labelled at 12 o'clock with their distance,
   and a legend in the dial's corner always names the current ring spacing —
   so zooming in or out re-scales both the rings and the legend. */
function ringStep(s) {
  for (const step of [5, 10, 20, 50, 100, 200, 500, 1000, 2000, 5000, 10000]) {
    if (step * s >= 42) return step; // rings never closer than ~42 px
  }
  return 20000;
}

function fmtDist(m) {
  if (m < 1000) return m + " m";
  const km = m / 1000;
  return (km % 1 === 0 ? km.toFixed(0) : km.toFixed(1)) + " km";
}

function drawRangeRings(g, cx, cy, s, avail, labelPx, legendPx, half) {
  const step = ringStep(s);
  g.textAlign = "left";
  g.textBaseline = "middle";
  g.font = Math.round(labelPx) + "px " + BEBAS;
  for (let i = 1; i * step * s <= avail; i++) {
    const r = i * step * s;
    g.beginPath();
    g.arc(cx, cy, r, 0, Math.PI * 2);
    g.strokeStyle = "rgba(165, 173, 206, 0.18)";
    g.lineWidth = 1;
    g.stroke();
    // distance label sitting on the ring at 12 o'clock
    g.fillStyle = "rgba(165, 173, 206, 0.55)";
    g.fillText(fmtDist(i * step), cx + 4, cy - r);
  }
  // legend: what one ring spacing means at the current scale
  g.textBaseline = "alphabetic";
  g.font = Math.round(legendPx) + "px " + BEBAS;
  g.fillStyle = "#626880";
  g.fillText(fmtDist(step) + " · RING", cx - half + 12, cy + half - 12);
}

let heading = null;    // heading, degrees clockwise from north (raw sources only)
let magHeading = null; // raw compass heading
let lastCourse = null; // latest GPS course-over-ground (deg)

const BEBAS = "'Bebas Neue', Impact, Haettenschweiler, 'Arial Narrow', sans-serif";

function onOrientation(e) {
  let h = null;
  if (e.type === "deviceorientationabsolute" && e.alpha != null) {
    h = 360 - e.alpha; // absolute alpha runs counter-clockwise
  } else if (typeof e.webkitCompassHeading === "number") {
    h = e.webkitCompassHeading;
  } else if (e.alpha != null && e.absolute) {
    h = 360 - e.alpha;
  }
  if (h != null && !isNaN(h)) {
    magHeading = ((h % 360) + 360) % 360; // magnetic-north referenced
  }
}
window.addEventListener("deviceorientationabsolute", onOrientation, true);
window.addEventListener("deviceorientation", onOrientation, true);

/* Pinch to zoom the route: two fingers spread/pinch override the automatic
   fit for ~10 seconds, then it eases back to automatic. Tracking never stops. */
const pinchPointers = new Map(); // pointerId -> [x, y]
let pinchDist = 0;

routeCanvas.addEventListener("pointerdown", (e) => {
  routeCanvas.setPointerCapture(e.pointerId);
  pinchPointers.set(e.pointerId, [e.clientX, e.clientY]);
  if (pinchPointers.size === 2) {
    const [a, b] = [...pinchPointers.values()];
    pinchDist = Math.hypot(a[0] - b[0], a[1] - b[1]);
  }
});

routeCanvas.addEventListener("pointermove", (e) => {
  if (!pinchPointers.has(e.pointerId)) return;
  pinchPointers.set(e.pointerId, [e.clientX, e.clientY]);
  if (pinchPointers.size === 2) {
    const [a, b] = [...pinchPointers.values()];
    const d = Math.hypot(a[0] - b[0], a[1] - b[1]);
    if (pinchDist > 0 && d > 0) {
      userZoom = Math.min(50, Math.max(0.1, userZoom * (d / pinchDist)));
      lastManualZoom = performance.now();
    }
    pinchDist = d;
    e.preventDefault();
  }
});

function releasePinch(e) {
  pinchPointers.delete(e.pointerId);
  pinchDist = 0;
}
routeCanvas.addEventListener("pointerup", releasePinch);
routeCanvas.addEventListener("pointercancel", releasePinch);

/* ---------- card gestures: checkpoint menu, share, delete ---------- */

/* One click opens a small menu at the tap point with add / remove checkpoint
   options, two quick clicks share the route view as a PNG, and holding a
   finger down for ~1 s (border fills red as progress) asks to delete every
   checkpoint and dot. Because 1/2 clicks are both valid, the action fires
   ~500 ms after the last click of a burst (taps up to 600 ms apart count as
   one burst). Taps that are part of a pinch never trigger anything. */
const canShareFiles = (() => {
  if (typeof navigator.share !== "function" || typeof navigator.canShare !== "function" || typeof File === "undefined") return false;
  try {
    return navigator.canShare({ files: [new File(["x"], "x.png", { type: "image/png" })] });
  } catch {
    return false;
  }
})();

let shareFlash = -1e9; // timestamp: drawRouteBox flashes the border on actions
let tapTimes = [];     // recent tap timestamps, for multi-tap detection
let tapStart = null;   // { id, t, x, y } of the finger that could be a tap
let holdTimer = null;  // pending long-press → delete everything
let holdStart = null;  // timestamp while the finger is down, for the blue fill
const HOLD_MS = 1000;  // long-press duration
let tapTimer = null;   // pending action after a burst of 1/2/3 clicks
let flashColor = "#a6d189"; // border flash colour of the last action

/* Catppuccin action colours: green = share, yellow = checkpoint added,
   red = checkpoint removed / hold progress, blue = everything cleared. */
const FLASH_SHARE = "#a6d189";
const FLASH_ADD = "#e5c890";
const FLASH_REMOVE = "#e78284";
const FLASH_CLEAR = "#8caaee";

const cpMenu = document.getElementById("cpMenu");
const cpBackdrop = document.getElementById("cpBackdrop");
const cpAddBtn = document.getElementById("cpAddBtn");
const cpRemoveBtn = document.getElementById("cpRemoveBtn");
const cpCancelBtn = document.getElementById("cpCancelBtn");

function hideCpMenu() {
  cpMenu.hidden = true;
  cpBackdrop.hidden = true;
}

function showCpMenu() {
  cpRemoveBtn.disabled = !route.some((p) => p.cp);
  cpMenu.hidden = false;
  cpBackdrop.hidden = false;
}

cpAddBtn.addEventListener("click", () => { hideCpMenu(); addCheckpoint(); });
cpRemoveBtn.addEventListener("click", () => { hideCpMenu(); removeCheckpoint(); });
cpCancelBtn.addEventListener("click", hideCpMenu);
cpBackdrop.addEventListener("click", hideCpMenu);

function flashBorder(color) {
  flashColor = color;
  shareFlash = performance.now();
}

function cancelHold() {
  if (holdTimer) { clearTimeout(holdTimer); holdTimer = null; }
  holdStart = null;
}
function clearTapTimer() {
  if (tapTimer) { clearTimeout(tapTimer); tapTimer = null; }
}

/* ---------- checkpoints ---------- */

function addCheckpoint() {
  if (!cur) return;
  route.push({ lat: cur.lat, lon: cur.lon, t: Date.now(), cp: true });
  saveRouteSoon();
  flashBorder(FLASH_ADD);
}

// remove the newest checkpoint (marked cp) — repeatable, works across reloads
function removeCheckpoint() {
  for (let i = route.length - 1; i >= 0; i--) {
    if (route[i].cp) {
      route.splice(i, 1);
      saveRoute();
      flashBorder(FLASH_REMOVE);
      return;
    }
  }
}

function clearAllDots() {
  route = [];
  try { localStorage.removeItem(ROUTE_KEY); } catch {}
  saveRouteSoon();
  flashBorder(FLASH_CLEAR);
}

routeCanvas.addEventListener("pointerdown", (e) => {
  // a second finger joining means a pinch — nothing else counts
  if (pinchPointers.size >= 2) { tapStart = null; cancelHold(); clearTapTimer(); return; }
  tapStart = { id: e.pointerId, t: performance.now(), x: e.clientX, y: e.clientY };
  cancelHold();
  clearTapTimer();
  holdStart = performance.now();
  holdTimer = setTimeout(() => {
    holdTimer = null;
    holdStart = null;
    if (!tapStart || tapStart.id !== e.pointerId) return;
    tapStart = null;
    tapTimes = [];
    if (confirm("Delete all checkpoints and dots? This cannot be undone.")) clearAllDots();
  }, HOLD_MS);
});

routeCanvas.addEventListener("pointermove", (e) => {
  if (!tapStart) return;
  if (pinchPointers.size >= 2 || e.pointerId !== tapStart.id) {
    tapStart = null;
    cancelHold();
    return;
  }
  // dragging disqualifies the gesture from being a tap or a hold
  if (Math.hypot(e.clientX - tapStart.x, e.clientY - tapStart.y) > 12) {
    tapStart = null;
    cancelHold();
  }
});

routeCanvas.addEventListener("pointerup", (e) => {
  cancelHold();
  const t = tapStart;
  tapStart = null;
  if (!t || e.pointerId !== t.id || pinchPointers.size > 0) return;
  const now = performance.now();
  if (now - t.t > 400 || Math.hypot(e.clientX - t.x, e.clientY - t.y) > 12) {
    tapTimes = [];
    return;
  }
  tapTimes = tapTimes.filter((tt) => now - tt < 600);
  tapTimes.push(now);
  clearTapTimer();
  const n = tapTimes.length;
  tapTimer = setTimeout(() => {
    tapTimer = null;
    tapTimes = [];
    if (n === 1) showCpMenu();
    else if (n >= 2) shareRoute();
  }, 500);
});
routeCanvas.addEventListener("pointercancel", () => {
  cancelHold();
  clearTapTimer();
  tapStart = null;
  tapTimes = [];
});

function downloadBlob(blob, name) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function routeDistance() {
  let d = 0;
  for (let i = 1; i < route.length; i++) {
    d += haversine(route[i - 1].lat, route[i - 1].lon, route[i].lat, route[i].lon);
  }
  return d;
}

/* Offscreen render of the dial at 2x for a crisp share image: same
   projection, fit rule and route layer as the live canvas (reused via
   routeProjector / routeFitExtent / drawRouteLayer), framed by a header
   and a stats row (distance, duration, peak speed, peak acceleration). */
function renderRouteShare() {
  const pad = 30;
  const dial = 520;
  const headH = 64;
  const statsH = 96;
  const W = dial + pad * 2;
  const H = pad + headH + 18 + dial + 24 + statsH + pad;
  const out = document.createElement("canvas");
  out.width = W * 2;
  out.height = H * 2;
  const g = out.getContext("2d");
  g.scale(2, 2);

  g.fillStyle = "#303446";
  g.fillRect(0, 0, W, H);

  /* header: brand left, date right, hairline underneath */
  g.textBaseline = "alphabetic";
  g.textAlign = "left";
  g.fillStyle = "#8caaee";
  g.font = "30px " + BEBAS;
  g.fillText("MIATED · ROUTE", pad, pad + 34);
  g.textAlign = "right";
  g.fillStyle = "#a5adce";
  g.font = "22px " + BEBAS;
  g.fillText(new Date().toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" }), W - pad, pad + 32);
  g.strokeStyle = "#51576d";
  g.lineWidth = 1;
  g.beginPath();
  g.moveTo(pad, pad + headH);
  g.lineTo(W - pad, pad + headH);
  g.stroke();

  /* dial — same chrome and rose as the live canvas */
  const dy = pad + headH + 18;
  const cx = W / 2;
  const cy = dy + dial / 2;
  const dialHalf = dial / 2 - 1;

  drawDialBackground(g, cx, cy, dial);

  // heading-up fit, same rule as the live dial
  const hdg = heading || 0;
  const proj = routeProjector(cur, hdg);
  const s = ((dialHalf - 14) * 0.86) / routeFitExtent(proj, route);

  // route layer, clipped to the dial like the live canvas does
  g.save();
  g.beginPath();
  roundedRectPath(g, cx, cy, dialHalf - 3, 8);
  g.clip();
  // range rings under the route — same rule as the live dial
  drawRangeRings(g, cx, cy, s, (dialHalf - 14) * 0.86, 13, 15, dialHalf - 14);
  drawRouteLayer(g, cx, cy, s, hdg, cur, route, 4, 8);
  g.restore();

  // compass rose — pixel-identical to the live dial's
  drawRose(g, cx, cy, dial, hdg);
  g.textBaseline = "alphabetic";

  /* stats row: four evenly spaced cells, small label over a big value */
  const sy = dy + dial + 24;
  const dist = routeDistance();
  const first = route[0], lastT = route[route.length - 1];
  const mins = first && lastT ? Math.max(1, Math.round((lastT.t - first.t) / 60000)) : 0;
  const cells = [
    ["DISTANCE", dist < 950 ? dist.toFixed(0) + " m" : (dist / 1000).toFixed(2) + " km"],
    ["TIME", mins < 60 ? mins + " min" : Math.floor(mins / 60) + " h " + (mins % 60) + " min"],
    ["TOP SPEED", (maxSpeed * 3.6).toFixed(1) + " km/h"],
    ["MAX ACCEL", maxAccel.toFixed(2) + " m/s²"],
  ];
  const cellW = (W - pad * 2) / cells.length;
  g.textAlign = "center";
  cells.forEach(([label, value], i) => {
    const x = pad + cellW * i + cellW / 2;
    g.fillStyle = "#626880";
    g.font = "17px " + BEBAS;
    g.fillText(label, x, sy + 22);
    g.fillStyle = "#8caaee";
    g.font = "34px " + BEBAS;
    g.fillText(value, x, sy + 60);
    if (i > 0) {
      g.strokeStyle = "#414559";
      g.lineWidth = 1;
      g.beginPath();
      g.moveTo(pad + cellW * i, sy + 4);
      g.lineTo(pad + cellW * i, sy + 66);
      g.stroke();
    }
  });
  return out;
}

async function shareRoute() {
  if (!cur || !route.length) return;
  flashBorder(FLASH_SHARE); // border flash while rendering
  const blob = await new Promise((res) => renderRouteShare().toBlob(res, "image/png"));
  if (!blob) return;
  const name = "miated_" + new Date().toISOString().slice(0, 10) + ".png";
  if (canShareFiles) {
    try {
      await navigator.share({
        files: [new File([blob], name, { type: "image/png" })],
        title: "miated — route",
      });
      return;
    } catch (err) {
      if (err.name === "AbortError") return; // sheet dismissed — do nothing
      // any other share failure → clipboard, then download
    }
  }
  if (navigator.clipboard && window.ClipboardItem) {
    try {
      await navigator.clipboard.write([new ClipboardItem({ "image/png": blob })]);
      return;
    } catch {} // needs a secure context — fall through to download
  }
  downloadBlob(blob, name);
}

/* ---------- heading: raw GPS course + raw compass ---------- */

/* No calibration, no learned offset: while moving, GPS course-over-ground is
   used as-is; while standing still, the raw compass heading is used as-is. */
function updateHeading(dt) {
  const moving = (speedSm || 0) > 1.2 && lastCourse !== null;
  let target = moving ? lastCourse : magHeading;

  if (target !== null) {
    target = ((target % 360) + 360) % 360;
    if (heading === null) heading = target;
    const dh = ((target - heading + 540) % 360) - 180;
    heading = (heading + dh * Math.min(1, dt * 5) + 360) % 360;
  }
}

/* Dial chrome shared by the live canvas and the share image: the rounded
   square background and the full compass rose (support-function ticks and
   cardinal dots), so the export looks exactly like the app. */
function roundedRectPath(g, cx, cy, halfSide, r) {
  g.moveTo(cx - halfSide + r, cy - halfSide);
  g.arcTo(cx + halfSide, cy - halfSide, cx + halfSide, cy + halfSide, r);
  g.arcTo(cx + halfSide, cy + halfSide, cx - halfSide, cy + halfSide, r);
  g.arcTo(cx - halfSide, cy + halfSide, cx - halfSide, cy - halfSide, r);
  g.arcTo(cx - halfSide, cy - halfSide, cx + halfSide, cy - halfSide, r);
  g.closePath();
}

function drawDialBackground(g, cx, cy, size) {
  g.beginPath();
  roundedRectPath(g, cx, cy, size / 2 - 1, 10);
  g.fillStyle = "#292c3c";
  g.fill();
  g.lineWidth = 2;
  g.strokeStyle = "#51576d";
  g.stroke();
}

function drawRose(g, cx, cy, size, hdgDeg) {
  const dialHalf = size / 2 - 1;
  const half = dialHalf - 1; // rose edge = the border stroke's inner edge
  const rad = 10;
  const side = half - rad; // straight-edge half-length of the rounded square
  const ringR = size * 0.045;      // cardinal dot radius
  const minorTick = size * 0.022;  // minor tick length
  const clearTick = size * 0.115;  // long-tick distance: how far the dot's
  // CENTRE must stay from every wall of the square (measured centre → wall)

  // bearing -> [x, y, outward-normal-x, outward-normal-y] on the border
  function rosePoint(deg) {
    const a = (deg - 90) * (Math.PI / 180); // screen angle: 0° bearing = up
    const ux = Math.cos(a), uy = Math.sin(a);
    const t = half / Math.max(Math.abs(ux), Math.abs(uy));
    let x = t * ux, y = t * uy, nx = 0, ny = 0;
    if (Math.abs(x) > side && Math.abs(y) > side) {
      // ray exits through a corner arc: project onto the corner circle
      const qx = Math.sign(x) * side, qy = Math.sign(y) * side;
      const dx = x - qx, dy = y - qy, dl = Math.hypot(dx, dy);
      x = qx + (dx / dl) * rad;
      y = qy + (dy / dl) * rad;
      nx = dx / dl;
      ny = dy / dl;
    } else if (Math.abs(ux) > Math.abs(uy)) {
      nx = Math.sign(ux);
    } else {
      ny = Math.sign(uy);
    }
    return [x, y, nx, ny];
  }

  // cardinal markers: letter in a hollow dot whose CENTRE keeps a distance
  // of one long tick (clearTick) from the walls of the square — measured
  // from the centre: to its own wall along the straight edges, and to BOTH
  // walls at once near a corner (the dot parks in the corner of the inset
  // square). The major tick stretches and tilts from the border point to
  // the dot so they always stay connected.
  function drawCardinals(h) {
    g.font = Math.round(size * 0.05) + "px " + BEBAS;
    g.textAlign = "center";
    g.textBaseline = "middle";
    const lim = half - clearTick; // the centre may not enter this inset square
    const cardinals = [["N", 0, "#e78284"], ["E", 90, "#a5adce"], ["S", 180, "#a5adce"], ["W", 270, "#a5adce"]];
    for (const [t, deg, col] of cardinals) {
      const [x, y, nx, ny] = rosePoint(deg - h);
      // rest: centre one long tick from its own wall
      let px = cx + x - nx * clearTick;
      let py = cy + y - ny * clearTick;
      // keep one long tick from the other wall too near a corner
      px = Math.min(cx + lim, Math.max(cx - lim, px));
      py = Math.min(cy + lim, Math.max(cy - lim, py));
      // major tick: from the border point to the dot's edge — stretches
      // and tilts as needed so it always stays connected
      const ddx = px - (cx + x), ddy = py - (cy + y);
      const dl = Math.hypot(ddx, ddy) || 1;
      g.beginPath();
      g.moveTo(cx + x, cy + y);
      g.lineTo(cx + x + (ddx / dl) * (dl - ringR), cy + y + (ddy / dl) * (dl - ringR));
      g.strokeStyle = "#8caaee";
      g.lineWidth = 2;
      g.stroke();
      g.beginPath();
      g.arc(px, py, ringR, 0, Math.PI * 2);
      g.strokeStyle = col;
      g.lineWidth = 1.5;
      g.stroke();
      g.fillStyle = col;
      g.fillText(t, px, py);
    }
  }

  // minor ticks every 10° — each tick starts AT the border so the lines
  // touch it (majors are stretched to their dots above)
  for (let i = 0; i < 36; i++) {
    if (i % 9 === 0) continue; // majors are stretched to their dots
    const [x, y, nx, ny] = rosePoint(i * 10 - hdgDeg);
    g.beginPath();
    g.moveTo(cx + x, cy + y);
    g.lineTo(cx + x - nx * minorTick, cy + y - ny * minorTick);
    g.strokeStyle = "#626880";
    g.lineWidth = 1;
    g.stroke();
  }

  drawCardinals(hdgDeg);
}

function drawRouteBox(dt) {
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const w = routeCanvas.clientWidth;
  const h = routeCanvas.clientHeight;
  if (!w || !h) return;
  if (routeCanvas.width !== Math.round(w * dpr) || routeCanvas.height !== Math.round(h * dpr)) {
    routeCanvas.width = Math.round(w * dpr);
    routeCanvas.height = Math.round(h * dpr);
  }
  rctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  rctx.clearRect(0, 0, w, h);

  const cx = w / 2;
  const cy = h / 2;
  const size = Math.min(w, h);
  const dialHalf = size / 2 - 1; // border sits flush at the element's end
  const dialRad = 10; // corner radius matching the canvas corners

  // dial background: rounded square (the canvas border is the one border)
  drawDialBackground(rctx, cx, cy, size);

  // share feedback: flash the border while the share image is being made
  const flash = performance.now() - shareFlash;
  if (flash < 450) {
    rctx.beginPath();
    roundedRectPath(rctx, cx, cy, dialHalf, dialRad);
    rctx.lineWidth = 4;
    rctx.globalAlpha = 1 - flash / 450;
    rctx.strokeStyle = flashColor;
    rctx.stroke();
    rctx.globalAlpha = 1;
  }

  // long-press progress: the border fills toward red over HOLD_MS
  if (holdStart !== null) {
    const p = Math.min(1, (performance.now() - holdStart) / HOLD_MS);
    rctx.beginPath();
    roundedRectPath(rctx, cx, cy, dialHalf, dialRad);
    rctx.lineWidth = 2 + p * 4;
    rctx.strokeStyle = `rgba(231, 130, 132, ${0.15 + p * 0.85})`;
    rctx.stroke();
  }

  if (!cur) return;

  // one source of truth for rotation: the same smoothed heading the rose uses
  const hdg = heading || 0;
  const proj = routeProjector(cur, hdg);

  // auto zoom: fit the bounding box of all live dots (in rotated screen
  // space) into the dial with a small margin — zoom out only as far as the
  // route actually needs, and gently zoom back in as it shrinks or dots
  // expire. Manual pinch overrides for ~10 s, then it eases back to auto.
  const autoScale = (dialHalf * 0.86) / routeFitExtent(proj, route);
  const manualActive = performance.now() - lastManualZoom < 10000;
  // while pinching, zoomFactor follows userZoom immediately (no double
  // smoothing, so the pinch is visible within a frame); easing back to auto
  // stays slow and gentle
  zoomFactor = manualActive ? userZoom : zoomFactor + (1 - zoomFactor) * Math.min(1, dt * 3);
  const target = autoScale * zoomFactor;
  viewScale = viewScale === null ? target : viewScale + (target - viewScale) * Math.min(1, dt * (manualActive ? 12 : 3));
  const s = viewScale;

  // the route: line under dots under the position marker, all heading-up
  rctx.save();
  rctx.beginPath();
  roundedRectPath(rctx, cx, cy, dialHalf - 3, Math.max(4, dialRad - 2));
  rctx.clip();
  // range rings under the route, sharing the same px-per-meter scale
  drawRangeRings(rctx, cx, cy, s, dialHalf * 0.86, size * 0.032, size * 0.036, dialHalf);
  drawRouteLayer(rctx, cx, cy, s, hdg, cur, route, Math.max(1.4, size * 0.009), Math.max(3, size * 0.016));
  rctx.restore();

  // compass rose — the exact same drawing the share image uses
  drawRose(rctx, cx, cy, size, hdg);
}

/* ---------- allow buttons ---------- */

/* One button per permission: taps are the reliable way to make Chrome show
   the dialog, and each button stays visible until ITS permission is actually
   granted — a request alone doesn't count as allowed. */
let micAllowed = false;
let gpsAllowed = false;

function updateAllowButton() {
  allowMicBtn.hidden = micAllowed;
  allowGpsBtn.hidden = gpsAllowed;
}

allowMicBtn.addEventListener("click", () => {
  startMic();
  updateAllowButton();
});

allowGpsBtn.addEventListener("click", () => {
  startGps();
  updateAllowButton();
});

/* ---------- keep the screen on ---------- */

/* Screen Wake Lock: the display stays on while the app is open. The lock is
   released by the OS whenever the page hides, so re-request on visibility. */
let wakeLock = null;

function requestWakeLock() {
  if (!("wakeLock" in navigator)) return; // not supported: silently skip
  navigator.wakeLock.request("screen").then((lock) => {
    wakeLock = lock;
    lock.addEventListener("release", () => { wakeLock = null; });
  }).catch(() => {}); // denied — nothing to do
}

/* ---------- auto-start everything ---------- */

window.addEventListener("load", () => {
  queryPerms();
  startMic();
  startGps();
  requestWakeLock();
  updateAllowButton();
});

document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") {
    wakeAudio();
    requestWakeLock(); // re-acquire after the OS dropped it
  }
});

/* ---------- pwa ---------- */

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js").then((reg) => {
      // Check for an update right away; controllerchange below reloads when
      // the new worker takes over, so a fresh launch never lags a deploy.
      reg.update().catch(() => {});
      // Installed PWAs can stay open for days without a normal navigation,
      // which is the only time browsers otherwise bother re-checking sw.js.
      // Poke it whenever the app regains focus, and every 30 minutes while open.
      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "visible") reg.update().catch(() => {});
      });
      setInterval(() => reg.update().catch(() => {}), 30 * 60 * 1000);
    }).catch(() => {});
  });

  // Once a new service worker takes control, the page it controls is still
  // running old JS in memory — reload once so the update actually shows up.
  let swRefreshing = false;
  navigator.serviceWorker.addEventListener("controllerchange", () => {
    if (swRefreshing) return;
    swRefreshing = true;
    window.location.reload();
  });
}
</script>

<div id="cpMenu" hidden>
  <div class="cpTitle">CHECKPOINT</div>
  <button id="cpAddBtn">+ Drop checkpoint here</button>
  <button id="cpRemoveBtn">− Remove last checkpoint</button>
  <button id="cpCancelBtn">Cancel</button>
</div>
